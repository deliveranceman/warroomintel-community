<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #0D0B14;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', serif;
    overflow: hidden;
  }
  .border {
    position: absolute;
    inset: 20px;
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 4px;
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 12px;
    height: 12px;
    border-color: #C9A84C;
    border-style: solid;
    opacity: 0.7;
  }
  .corner.tl { top: 20px; left: 20px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 20px; right: 20px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 20px; left: 20px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 20px; right: 20px; border-width: 0 2px 2px 0; }
  .logo { width: 80px; height: 80px; object-fit: contain; margin-bottom: 28px; opacity: 0.9; }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.35em;
    color: #C9A84C;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .title {
    font-size: 52px;
    font-weight: 700;
    color: #e8e0d0;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
    text-align: center;
  }
  .subtitle {
    font-size: 18px;
    color: #9a8c74;
    font-style: italic;
    letter-spacing: 0.02em;
    margin-bottom: 32px;
  }
  .url {
    font-size: 14px;
    color: #C9A84C;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .divider {
    width: 60px;
    height: 1px;
    background: rgba(201,168,76,0.35);
    margin: 20px auto;
  }
</style>
</head>
<body>
  <div class="border"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <img src="/logo.png" alt="War Room Intel" class="logo" />
  <div class="eyebrow">✦ War Room Intel ✦</div>
  <div class="title">War Room Intel</div>
  <div class="subtitle">Intelligence for Spiritual Warfare</div>
  <div class="divider"></div>
  <div class="url">warroomintel.com</div>
</body>
</html>
